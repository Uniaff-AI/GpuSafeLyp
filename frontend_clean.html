<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LipSync AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .status-bar {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        
        .status-info {
            display: flex;
            gap: 30px;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .container {
            flex: 1;
            display: flex;
            padding: 20px;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }
        
        .left-panel, .right-panel {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .left-panel {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .right-panel {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            max-height: calc(100vh - 200px);
        }
        
        .upload-section {
            text-align: center;
        }
        
        .upload-area {
            border: 3px dashed rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            cursor: pointer;
            margin: 10px 0;
        }
        
        .upload-area:hover {
            border-color: #4CAF50;
            background: rgba(76, 175, 80, 0.1);
        }
        
        .upload-area.dragover {
            border-color: #FFD700;
            background: rgba(255, 215, 0, 0.1);
        }
        
        .upload-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        input[type="file"] {
            display: none;
        }
        
        .btn {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(76, 175, 80, 0.3);
        }
        
        .btn:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .server-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .server-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .server-card.online {
            border-color: #4CAF50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.2);
        }
        
        .server-card.offline {
            border-color: #f44336;
            opacity: 0.7;
        }
        
        .server-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .server-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        
        .status-dot.online {
            background: #4CAF50;
        }
        
        .status-dot.offline {
            background: #f44336;
        }
        
        .server-stats {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .tasks-section h3 {
            margin-bottom: 20px;
            color: #FFD700;
        }
        
        .task-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .task-item:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .task-id {
            font-family: monospace;
            font-size: 0.9rem;
            opacity: 0.7;
        }
        
        .task-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .task-status.started {
            background: #2196F3;
        }
        
        .task-status.completed {
            background: #4CAF50;
        }
        
        .task-status.failed {
            background: #f44336;
        }
        
        .task-status.timeout {
            background: #FF9800;
        }
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            margin: 10px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            border-radius: 5px;
            transition: width 0.3s ease;
        }
        
        .task-message {
            margin-top: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            font-size: 0.9rem;
        }
        
        .task-timing {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            opacity: 0.7;
            margin-top: 10px;
        }
        
        .download-btn {
            background: #FF9800;
            padding: 8px 16px;
            border-radius: 15px;
            text-decoration: none;
            color: white;
            font-size: 0.9rem;
            font-weight: bold;
            margin-top: 10px;
            display: inline-block;
            transition: all 0.3s ease;
        }
        
        .download-btn:hover {
            background: #F57C00;
            transform: translateY(-1px);
        }
        
        .file-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 0.9rem;
        }
        
        .refresh-btn {
            background: #2196F3;
            padding: 8px 16px;
            border-radius: 15px;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
        }
        
        .refresh-btn:hover {
            background: #1976D2;
        }
        
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                padding: 10px;
            }
            
            .server-grid {
                grid-template-columns: 1fr;
            }
            
            .status-info {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎬 LipSync AI</h1>
    </div>
    
    <div class="status-bar">
        <div class="status-info">
            <div class="status-item">
                <div class="status-indicator"></div>
                <span>API Status: <span id="api-status">Connected</span></span>
            </div>
            <div class="status-item">
                <span>Online Servers: <span id="server-count">0/8</span></span>
            </div>
            <div class="status-item">
                <span>Active Tasks: <span id="task-count">0</span></span>
            </div>
        </div>
        <button class="refresh-btn" onclick="loadServerStatus()">🔄 Refresh</button>
    </div>
    
    <div class="container">
        <div class="left-panel">
            <div class="upload-section">
                <h3>📁 Upload Files</h3>
                
                <div class="upload-area" onclick="document.getElementById('audio-file').click()">
                    <div class="upload-icon">🎵</div>
                    <p>Click to upload Audio file</p>
                    <p style="font-size: 0.8rem; opacity: 0.7;">MP3, WAV, etc.</p>
                </div>
                <input type="file" id="audio-file" accept="audio/*" onchange="uploadFile(this, 'audio')">
                <div id="audio-info" class="file-info" style="display: none;"></div>
                
                <div class="upload-area" onclick="document.getElementById('video-file').click()">
                    <div class="upload-icon">🎥</div>
                    <p>Click to upload Video file</p>
                    <p style="font-size: 0.8rem; opacity: 0.7;">MP4, AVI, MOV, etc.</p>
                </div>
                <input type="file" id="video-file" accept="video/*" onchange="uploadFile(this, 'video')">
                <div id="video-info" class="file-info" style="display: none;"></div>
                
                <button class="btn" id="generate-btn" onclick="generateLipSync()" disabled>
                    🚀 Generate LipSync
                </button>
            </div>
            
            <div class="server-status">
                <h3>🖥️ GPU Servers Status</h3>
                <div id="server-grid" class="server-grid">
                    <!-- Server cards will be populated here -->
                </div>
            </div>
        </div>
        
        <div class="right-panel">
            <div class="tasks-section">
                <h3>📋 Tasks & Results</h3>
                <div id="tasks-container">
                    <p style="opacity: 0.7; text-align: center;">No tasks yet. Upload files and generate LipSync to get started!</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://89.208.11.177:8000';
        let uploadedFiles = { audio: null, video: null };
        let tasks = {};

        async function uploadFile(input, type) {
            const file = input.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(`${API_URL}/upload`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const result = await response.json();
                    uploadedFiles[type] = result.filename;
                    
                    const infoDiv = document.getElementById(`${type}-info`);
                    infoDiv.style.display = 'block';
                    infoDiv.innerHTML = `
                        ✅ <strong>${result.original_name}</strong><br>
                        Size: ${(result.size / 1024 / 1024).toFixed(2)} MB
                    `;
                    
                    checkGenerateButton();
                    console.log(`${type} uploaded:`, result);
                } else {
                    alert(`Failed to upload ${type} file`);
                }
            } catch (error) {
                console.error('Upload error:', error);
                alert(`Error uploading ${type} file`);
            }
        }

        function checkGenerateButton() {
            const generateBtn = document.getElementById('generate-btn');
            if (uploadedFiles.audio && uploadedFiles.video) {
                generateBtn.disabled = false;
                generateBtn.style.background = 'linear-gradient(45deg, #4CAF50, #45a049)';
            } else {
                generateBtn.disabled = true;
                generateBtn.style.background = '#666';
            }
        }

        async function generateLipSync() {
            if (!uploadedFiles.audio || !uploadedFiles.video) {
                alert('Please upload both audio and video files first');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        audio_file: uploadedFiles.audio,
                        video_file: uploadedFiles.video
                    })
                });

                if (response.ok) {
                    const result = await response.json();
                    console.log('Generation started:', result);
                    
                    // Start monitoring the task
                    monitorTask(result.task_id);
                } else {
                    const error = await response.json();
                    alert(`Failed to start generation: ${error.detail}`);
                }
            } catch (error) {
                console.error('Generation error:', error);
                alert('Error starting generation');
            }
        }

        async function monitorTask(taskId) {
            const checkTask = async () => {
                try {
                    const response = await fetch(`${API_URL}/task/${taskId}`);
                    if (response.ok) {
                        const task = await response.json();
                        tasks[taskId] = task;
                        updateTasksDisplay();
                        
                        if (task.status === 'started') {
                            setTimeout(checkTask, 2000); // Check every 2 seconds
                        }
                    }
                } catch (error) {
                    console.error('Task monitoring error:', error);
                }
            };
            
            checkTask();
        }

        function updateTasksDisplay() {
            const container = document.getElementById('tasks-container');
            const taskList = Object.values(tasks).reverse(); // Show newest first
            
            if (taskList.length === 0) {
                container.innerHTML = '<p style="opacity: 0.7; text-align: center;">No tasks yet. Upload files and generate LipSync to get started!</p>';
                return;
            }
            
            container.innerHTML = taskList.map(task => {
                const startTime = task.started_at ? new Date(task.started_at).toLocaleTimeString() : 'Unknown';
                const duration = task.duration || '0s';
                
                let resultSection = '';
                if (task.status === 'completed' && task.result_url) {
                    resultSection = `<a href="${task.result_url}" target="_blank" class="download-btn">📥 Download Result</a>`;
                }
                
                return `
                    <div class="task-item">
                        <div class="task-header">
                            <span class="task-id">Task: ${task.task_id.substring(0, 8)}...</span>
                            <span class="task-status ${task.status}">${task.status}</span>
                        </div>
                        
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${task.progress || 0}%"></div>
                        </div>
                        
                        <div class="task-message">${task.message || 'Processing...'}</div>
                        
                        <div class="task-timing">
                            <span>⏰ Started: ${startTime}</span>
                            <span>⏱️ Duration: ${duration}</span>
                        </div>
                        
                        ${task.audio_file && task.video_file ? `
                            <div style="font-size: 0.8rem; opacity: 0.7; margin-top: 10px;">
                                🎵 ${task.audio_file} + 🎥 ${task.video_file}
                            </div>
                        ` : ''}
                        
                        ${resultSection}
                    </div>
                `;
            }).join('');
            
            document.getElementById('task-count').textContent = Object.keys(tasks).length;
        }

        async function loadServerStatus() {
            try {
                const response = await fetch(`${API_URL}/servers/status`);
                if (response.ok) {
                    const data = await response.json();
                    updateServerDisplay(data.servers);
                    
                    const onlineCount = data.servers.filter(s => s.status === 'online').length;
                    document.getElementById('server-count').textContent = `${onlineCount}/${data.servers.length}`;
                    document.getElementById('api-status').textContent = 'Connected';
                } else {
                    document.getElementById('api-status').textContent = 'Error';
                }
            } catch (error) {
                console.error('Server status error:', error);
                document.getElementById('api-status').textContent = 'Disconnected';
            }
        }

        function updateServerDisplay(servers) {
            const grid = document.getElementById('server-grid');
            grid.innerHTML = servers.map(server => `
                <div class="server-card ${server.status}">
                    <div class="server-header">
                        <strong>${server.name}</strong>
                        <div class="server-status">
                            <span class="status-dot ${server.status}"></span>
                            ${server.status.toUpperCase()}
                        </div>
                    </div>
                    <div class="server-stats">
                        <div>🖥️ GPU ${server.gpu_id} | ${server.url}</div>
                        <div>📊 Queue: ${server.queue_size} | Load: ${server.load_score}</div>
                        <div>💾 VRAM: ${Math.round(server.memory_used / 1024 / 1024)}MB / ${Math.round(server.memory_total / 1024 / 1024)}MB</div>
                    </div>
                </div>
            `).join('');
        }

        // Auto-refresh server status
        setInterval(loadServerStatus, 5000);
        
        // Initial load
        loadServerStatus();
        
        // Drag and drop functionality
        document.addEventListener('DOMContentLoaded', function() {
            const uploadAreas = document.querySelectorAll('.upload-area');
            
            uploadAreas.forEach(area => {
                area.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    area.classList.add('dragover');
                });
                
                area.addEventListener('dragleave', () => {
                    area.classList.remove('dragover');
                });
                
                area.addEventListener('drop', (e) => {
                    e.preventDefault();
                    area.classList.remove('dragover');
                    
                    const files = e.dataTransfer.files;
                    if (files.length > 0) {
                        const input = area.nextElementSibling;
                        input.files = files;
                        input.dispatchEvent(new Event('change'));
                    }
                });
            });
        });
    </script>
</body>
</html>
